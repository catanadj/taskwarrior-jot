name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run static type checks
        run: python -m mypy

      - name: Compile source files
        run: python -m compileall -q jot_core jot_tui

      - name: Build and validate distribution artifacts
        run: |
          python -m build
          python tools/check_artifacts.py
          python tools/write_checksums.py dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Install wheel without optional UI dependencies
        run: python tools/check_install.py dist/*.whl

      - name: Install source archive without optional UI dependencies
        run: python tools/check_install.py dist/*.tar.gz

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Enforce focused core coverage
        run: |
          rm -f .coverage .coverage.*
          for pattern in test_core_reading.py test_storage.py test_nautical_fixture.py test_timelog_core.py; do
            coverage run --parallel-mode \
              --source=jot_core.notes,jot_core.frontmatter,jot_core.storage,jot_core.nautical \
              -m unittest discover -s tests -p "$pattern" -q
          done
          coverage combine
          coverage report \
            --include='jot_core/notes.py,jot_core/frontmatter.py,jot_core/storage.py,jot_core/nautical.py' \
            --fail-under=70

      - name: Enforce failure-path coverage
        run: |
          rm -f .coverage .coverage.*
          for pattern in test_doctor.py test_taskwarrior_client.py test_cli_orchestration.py; do
            coverage run --parallel-mode \
              --source=jot_core.cli,jot_core.doctor,jot_core.config,jot_core.taskwarrior \
              -m unittest discover -s tests -p "$pattern" -q
          done
          coverage combine
          coverage report \
            --include='jot_core/cli.py,jot_core/doctor.py,jot_core/config.py,jot_core/taskwarrior.py' \
            --fail-under=45

  tui-compatibility:
    name: Textual ${{ matrix.textual }} / Rich ${{ matrix.rich }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - textual: "0.50.1"
            rich: "13.3.3"
          - textual: "6.1.0"
            rich: "13.9.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned TUI dependencies
        run: python -m pip install --upgrade pip && python -m pip install "textual==${{ matrix.textual }}" "rich==${{ matrix.rich }}" coverage

      - name: Run TUI pilot tests
        run: python -m unittest discover -s tests -p 'test_tui.py' -v

      - name: Enforce TUI coverage
        run: |
          rm -f .coverage .coverage.*
          for pattern in test_tui.py test_tui_launcher.py test_tui_rendering.py test_tui_state.py; do
            coverage run --parallel-mode --source=jot_tui \
              -m unittest discover -s tests -p "$pattern" -q
          done
          coverage combine
          coverage report --include='jot_tui/**/*.py,jot_tui/*.py' --fail-under=50

  documentation:
    name: Strict documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: python -m pip install --upgrade pip mkdocs

      - name: Build documentation strictly
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/jot-site"

  install-smoke:
    name: Installer without Textual
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package without runtime extras
        run: python -m pip install --upgrade pip && python -m pip install --no-deps .

      - name: Verify CLI works without Textual
        run: |
          python -c 'import importlib.util; assert importlib.util.find_spec("textual") is None'
          jot --version
          jot --help >/dev/null

      - name: Verify installer layout
        run: |
          root=$(mktemp -d)
          HOME="$root/home" TASKDATA="$root/taskdata" PREFIX="$root/prefix" \
            XDG_CONFIG_HOME="$root/config" XDG_DATA_HOME="$root/data" \
            ./install.sh --no-timelog-hook
          test -x "$root/prefix/bin/jot"
          HOME="$root/home" TASKDATA="$root/taskdata" PREFIX="$root/prefix" \
            "$root/prefix/bin/jot" --version

  shell-hardening:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate shell scripts
        run: |
          bash -n bootstrap.sh install.sh uninstall.sh
          shellcheck bootstrap.sh install.sh uninstall.sh

  taskwarrior-integration:
    name: Taskwarrior integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Taskwarrior
        run: |
          sudo apt-get update
          sudo apt-get install --yes taskwarrior

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jot without optional UI dependencies
        run: python -m pip install --upgrade pip && python -m pip install --no-deps .

      - name: Run real Taskwarrior integration tests
        run: python -m unittest discover -s tests -p 'test_taskwarrior_integration.py' -v
