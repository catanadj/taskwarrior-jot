      <g transform="translate(383 246)" filter="url(#smallShadow)"><path d="M-236 0H-38M38 0H236" stroke="url(#gold)" stroke-width="2.2"/><path d="M0-23L6-7L23 0L6 7L0 23L-6 7L-23 0L-6-7Z" fill="url(#gold)"/><path d="M0-15L3-4L15 0L3 4L0 15L-3 4L-15 0L-3-4Z" fill="#fff0bd" opacity=".58"/><circle r="3.1" fill="#fff7d7"/></g>
      <text x="128" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#e8e4dc" letter-spacing="2.15">The notebook beside your tasks.</text>
    </g>
    <g id="compassRose" transform="translate(1097 166)" opacity=".52" aria-label="Compass rose">
      <circle r="126" fill="#08263b" fill-opacity=".28" stroke="#5595b2" stroke-width="2"/><circle r="93" fill="none" stroke="#6aa6be" stroke-width="1.4" stroke-dasharray="4 10"/><circle r="17" fill="#3f7e9c" opacity=".42"/>
      <g fill="#4f94b1"><path d="M0-112L13-20L0 0L-13-20Z"/><path d="M112 0L20 13L0 0L20-13Z" opacity=".82"/><path d="M0 112L-13 20L0 0L13 20Z" opacity=".52"/><path d="M-112 0L-20-13L0 0L-20 13Z" opacity=".68"/></g>
      <g fill="#1e5d7d"><path d="M-68-68L-12-5L0 0L-5-12Z"/><path d="M68-68L12-5L0 0L5-12Z"/><path d="M68 68L12 5L0 0L5 12Z"/><path d="M-68 68L-12 5L0 0L-5 12Z"/></g>
      <path d="M0-112V112M-112 0H112" stroke="#72abc0" stroke-width="1" opacity=".56"/>
      <g fill="#75a9bc" font-family="Georgia,serif" font-size="17" text-anchor="middle"><text y="-139">N</text><text y="151">S</text><text x="143" y="6">E</text><text x="-143" y="6">W</text></g>
    </g>
    <ellipse cx="1113" cy="423" rx="276" ry="39" fill="#000a12" opacity=".47"/>
