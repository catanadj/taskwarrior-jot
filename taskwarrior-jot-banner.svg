      <path data-page-layer="true" d="M813 350Q901 364 1000 389Q1036 399 1058 389Q1085 376 1120 384L1276 401L1273 411L1117 394Q1083 388 1057 401Q1034 413 996 401L810 373Z" fill="#f0e6d5"/>
      <path d="M817 222Q857 204 921 214L1030 235Q1053 239 1067 253C1068 295 1062 348 1053 400Q1031 411 996 402Q906 376 811 367L836 236Q839 224 817 222Z" fill="url(#paperLeft)" stroke="#e4d7c4" stroke-width="1.5"/>
      <path d="M1067 253Q1089 229 1123 218Q1165 205 1222 214L1290 226Q1302 228 1299 243L1269 400Q1266 412 1251 410L1114 393Q1083 388 1053 400Z" fill="url(#paperRight)" stroke="#e3d5c0" stroke-width="1.5"/>
      <path d="M1067 253C1070 299 1062 354 1053 400" fill="none" stroke="#b9aa95" stroke-width="3.3" opacity=".62"/><path d="M1061 253C1065 300 1057 354 1050 394" fill="none" stroke="#fffdf4" stroke-width="1.5" opacity=".9"/>
      <path d="M1054 401Q1068 407 1076 421Q1065 447 1041 461L1035 445Q1049 431 1043 411Z" fill="#175170"/><path d="M1041 461Q1052 446 1058 428" fill="none" stroke="#2b6d8a" stroke-width="2" opacity=".7"/>
      <g fill="none" stroke="#2c7290" stroke-width="2" opacity=".9"><path d="M854 266l12 2-3 12-12-2ZM855 272l4 4 10-11M845 298l12 2-3 12-12-2ZM846 304l4 4 10-11M838 330l12 2-3 12-12-2Z"/><path d="M875 273C922 279 966 288 1008 298M866 306C917 312 958 322 999 332M861 338C902 344 944 352 985 363" stroke="#6aa4b9" stroke-width="1.55" opacity=".68"/></g>
      <g fill="none" stroke-linecap="round"><path d="M1110 292a20 20 0 1 1-.1 0" stroke="#7bb3c2" stroke-width="7.5" opacity=".62"/><path d="M1110 292a20 20 0 0 1 18-18" stroke="#185c7a" stroke-width="7.5"/><path d="M1091 328L1145 333M1089 340L1134 345" stroke="#62a0b6" stroke-width="1.65"/><path d="M1083 374C1103 365 1115 385 1137 371C1161 355 1179 390 1204 373C1220 362 1233 381 1250 378" stroke="#0f5272" stroke-width="2.25"/></g>
    </g>
    <!-- Quill -->
    <g id="quill" filter="url(#smallShadow)">
      <path d="M1175 297C1190 242 1218 177 1261 124C1293 84 1330 56 1366 40C1358 85 1344 126 1320 163C1283 219 1236 260 1181 303Z" fill="url(#feather)" stroke="#6fa7b9" stroke-width="1.6"/>
