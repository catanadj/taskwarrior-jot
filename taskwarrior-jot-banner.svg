<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2636"/>
      <stop offset="100%" stop-color="#0c131e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d9a8"/>
      <stop offset="50%" stop-color="#d8bd7c"/>
      <stop offset="100%" stop-color="#e9d9a8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- === Ship's wheel === -->
  <g transform="translate(160,150)">
    <g id="wheel" stroke="#e8ddc0" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <circle r="92" stroke-width="4"/>
      <circle r="70" stroke-width="2.5"/>
      <circle r="10" fill="#e8ddc0" stroke="none"/>
      <g stroke-width="3">
        <line x1="10" y1="0" x2="70" y2="0"/>
        <line x1="7.07" y1="7.07" x2="49.5" y2="49.5"/>
        <line x1="0" y1="10" x2="0" y2="70"/>
        <line x1="-7.07" y1="7.07" x2="-49.5" y2="49.5"/>
        <line x1="-10" y1="0" x2="-70" y2="0"/>
        <line x1="-7.07" y1="-7.07" x2="-49.5" y2="-49.5"/>
        <line x1="0" y1="-10" x2="0" y2="-70"/>
        <line x1="7.07" y1="-7.07" x2="49.5" y2="-49.5"/>
      </g>
      <g stroke-width="6">
        <line x1="92" y1="0" x2="118" y2="0"/>
        <line x1="65.05" y1="65.05" x2="83.4" y2="83.4"/>
        <line x1="0" y1="92" x2="0" y2="118"/>
        <line x1="-65.05" y1="65.05" x2="-83.4" y2="83.4"/>
        <line x1="-92" y1="0" x2="-118" y2="0"/>
        <line x1="-65.05" y1="-65.05" x2="-83.4" y2="-83.4"/>
        <line x1="0" y1="-92" x2="0" y2="-118"/>
        <line x1="65.05" y1="-65.05" x2="83.4" y2="-83.4"/>
      </g>
      <g stroke-width="2.5">
        <circle cx="0" cy="70" r="2.2" fill="#e8ddc0" stroke="none"/>
        <circle cx="49.5" cy="49.5" r="2.2" fill="#e8ddc0" stroke="none"/>
        <circle cx="70" cy="0" r="2.2" fill="#e8ddc0" stroke="none"/>
        <circle cx="49.5" cy="-49.5" r="2.2" fill="#e8ddc0" stroke="none"/>
        <circle cx="0" cy="-70" r="2.2" fill="#e8ddc0" stroke="none"/>
        <circle cx="-49.5" cy="-49.5" r="2.2" fill="#e8ddc0" stroke="none"/>
        <circle cx="-70" cy="0" r="2.2" fill="#e8ddc0" stroke="none"/>
        <circle cx="-49.5" cy="49.5" r="2.2" fill="#e8ddc0" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- === Title === -->
  <g transform="translate(600,122)" text-anchor="middle">
    <line x1="-260" x2="260" y1="-34" y2="-34" stroke="#d8bd7c" stroke-width="3"/>
    <text y="10" font-size="38" letter-spacing="3" fill="url(#gold)" font-weight="bold">TASKWARRIOR JOT</text>
    <line x1="-260" x2="260" y1="26" y2="26" stroke="#d8bd7c" stroke-width="3"/>
    <text y="60" font-size="17" font-style="italic" fill="#cdd6e0" opacity="0.8">A notebook beside every task.</text>
  </g>

  <!-- === Open notebook with quill === -->
  <g transform="translate(1015,150)">
    <!-- left page -->
    <path d="M -110,-58 Q -60,-70 0,-58 L 0,62 Q -60,50 -110,62 Z" fill="#efe6cf" stroke="#8a7a52" stroke-width="2"/>
    <!-- right page -->
    <path d="M 110,-58 Q 60,-70 0,-58 L 0,62 Q 60,50 110,62 Z" fill="#f5eeda" stroke="#8a7a52" stroke-width="2"/>
    <!-- binding shadow -->
    <path d="M 0,-58 L 0,62" stroke="#6b5c3a" stroke-width="2" opacity="0.5"/>

    <!-- text lines, left page -->
    <g stroke="#8a7a52" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="-95" y1="-38" x2="-25" y2="-42"/>
      <line x1="-95" y1="-20" x2="-15" y2="-24"/>
      <line x1="-95" y1="-2" x2="-30" y2="-5"/>
    </g>
    <!-- text lines, right page (last one "being written") -->
    <g stroke="#8a7a52" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="20" y1="-42" x2="90" y2="-38"/>
      <line x1="20" y1="-24" x2="95" y2="-20"/>
    </g>
    <line id="writeline" x1="18" y1="-2" x2="88" y2="2" stroke="#8a7a52" stroke-width="3" stroke-linecap="round" stroke-dasharray="72" stroke-dashoffset="72">
      <animate attributeName="stroke-dashoffset" values="72;0;0;72" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- quill -->
    <g id="quill" stroke="#e8ddc0" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="18,-2; 88,2; 88,2; 18,-2" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="72" y2="-58"/>
      <path d="M 60,-46 Q 78,-58 90,-72" stroke-width="2"/>
      <path d="M 66,-40 Q 84,-50 96,-64" stroke-width="2"/>
    </g>
    <circle cx="0" cy="0" r="2.6" fill="#3a3225">
      <animateTransform attributeName="transform" type="translate" values="18,-2; 88,2; 88,2; 18,-2" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.2;3;2.2" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="300" fill="url(#vignette)"/>
</svg>
