      <path data-page-layer="true" d="M814 347Q906 361 1000 386Q1037 396 1058 386Q1086 373 1121 381L1278 398L1275 409L1119 391Q1083 385 1057 398Q1035 410 996 398L810 370Z" fill="#eee4d3"/>
