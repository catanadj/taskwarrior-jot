<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Taskwarrior Jot banner</title>
  <desc id="desc">Taskwarrior Jot, the notebook beside your tasks, with an open notebook, compass rose, and quill on a deep nautical background.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061827"/><stop offset=".48" stop-color="#0a2c45"/><stop offset="1" stop-color="#071a2d"/></linearGradient>
    <radialGradient id="atmosphere" cx="74%" cy="35%" r="67%"><stop offset="0" stop-color="#195274" stop-opacity=".72"/><stop offset=".48" stop-color="#0e3a57" stop-opacity=".3"/><stop offset="1" stop-color="#020d17" stop-opacity="0"/></radialGradient>
    <radialGradient id="titleGlow" cx="35%" cy="43%" r="42%"><stop offset="0" stop-color="#1d5571" stop-opacity=".24"/><stop offset="1" stop-color="#0b2a42" stop-opacity="0"/></radialGradient>
    <linearGradient id="jotText" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a7d3df"/><stop offset="1" stop-color="#5f9db8"/></linearGradient>
    <linearGradient id="paperLeft" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".72" stop-color="#f7eddb"/><stop offset="1" stop-color="#e7d9c4"/></linearGradient>
    <linearGradient id="paperRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6ead5"/><stop offset=".18" stop-color="#fffaf0"/><stop offset=".82" stop-color="#f8eedc"/><stop offset="1" stop-color="#e4d4bb"/></linearGradient>
    <linearGradient id="pageEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ddc9"/><stop offset="1" stop-color="#b9ad9d"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123c55"/><stop offset="1" stop-color="#04121f"/></linearGradient>
    <linearGradient id="feather" x1="0" y1="1" x2=".8" y2="0"><stop offset="0" stop-color="#0b334e"/><stop offset=".52" stop-color="#185875"/><stop offset="1" stop-color="#4687a2"/></linearGradient>
    <linearGradient id="featherShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#061b2d"/><stop offset="1" stop-color="#174f6c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe09a"/><stop offset=".5" stop-color="#e3aa4f"/><stop offset="1" stop-color="#9b6426"/></linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="190%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/><feOffset in="blur" dx="2" dy="14" result="offset"/><feFlood flood-color="#000913" flood-opacity=".62" result="color"/><feComposite in="color" in2="offset" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="1" dy="4" result="offset"/><feFlood flood-color="#00101c" flood-opacity=".55" result="color"/><feComposite in="color" in2="offset" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frameClip"><rect width="1400" height="500" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frameClip)">
    <rect width="1400" height="500" rx="20" fill="url(#ocean)"/>
    <rect width="1400" height="500" fill="url(#atmosphere)"/>
    <ellipse cx="405" cy="210" rx="500" ry="270" fill="url(#titleGlow)"/>
    <path d="M0 410C190 338 350 347 516 389C693 434 850 461 1030 433C1170 412 1288 360 1400 353V500H0Z" fill="#041421" opacity=".46"/>
