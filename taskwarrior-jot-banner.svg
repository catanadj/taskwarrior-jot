      <path d="M1068 250Q1090 226 1124 216Q1166 203 1223 212L1292 224Q1305 226 1301 242L1270 397Q1267 412 1251 409L1114 391Q1082 386 1052 397Z" fill="url(#paperRight)" stroke="#e5d7c3" stroke-width="1.7"/>
      <path d="M1068 250C1072 293 1061 350 1052 397" fill="none" stroke="#bcae9b" stroke-width="4" opacity=".72"/><path d="M1062 250C1064 291 1057 345 1049 392" fill="none" stroke="#fffdf4" stroke-width="1.7" opacity=".85"/>
      <path d="M1053 399Q1068 404 1076 420Q1065 447 1040 462L1034 445Q1049 431 1042 409Z" fill="#175170"/><path d="M1040 462Q1052 447 1058 428" fill="none" stroke="#2b6d8a" stroke-width="2" opacity=".75"/>
      <g fill="none" stroke="#2c7290" stroke-width="2.2" opacity=".92"><path d="M854 263l12 2-3 12-12-2ZM855 269l4 4 10-11M845 294l12 2-3 12-12-2ZM846 300l4 4 10-11M838 326l12 2-3 12-12-2Z"/><path d="M875 270C923 276 966 285 1010 295M866 302C919 308 958 319 1001 329M861 334C904 340 945 348 987 360" stroke="#6aa4b9" stroke-width="1.7" opacity=".7"/></g>
      <g fill="none" stroke-linecap="round"><path d="M1110 290a20 20 0 1 1-.1 0" stroke="#7bb3c2" stroke-width="8" opacity=".68"/><path d="M1110 290a20 20 0 0 1 18-18" stroke="#185c7a" stroke-width="8"/><path d="M1091 325L1145 330M1089 337L1134 342" stroke="#62a0b6" stroke-width="1.8"/><path d="M1083 371C1103 362 1115 382 1137 368C1161 352 1179 387 1204 370C1220 359 1233 378 1250 375" stroke="#0f5272" stroke-width="2.5"/></g>
    </g>
    <!-- Quill -->
    <g id="quill" filter="url(#smallShadow)">
      <path d="M1175 297C1190 242 1218 177 1261 124C1293 84 1330 56 1366 40C1358 85 1344 126 1320 163C1283 219 1236 260 1181 303Z" fill="url(#feather)" stroke="#6fa7b9" stroke-width="1.6"/>
