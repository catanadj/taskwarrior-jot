      <path d="M1180 300C1234 222 1297 126 1357 50" fill="none" stroke="#f0bf65" stroke-width="3"/><path d="M1180 300C1234 222 1297 126 1357 50" fill="none" stroke="#fff0bd" stroke-width="1" opacity=".88"/>
      <g fill="none" stroke="#061b2c" stroke-width="1.5" opacity=".8"><path d="M1210 256L1189 247M1221 238L1196 227M1232 220L1206 207M1244 201L1217 187M1256 181L1229 168M1268 161L1242 149M1281 141L1255 129M1294 121L1268 110M1307 103L1282 91M1320 85L1298 74"/><path d="M1224 251L1257 244M1236 231L1273 221M1249 211L1288 199M1262 191L1302 178M1276 169L1317 155M1289 149L1329 133M1303 128L1340 110M1317 106L1350 86"/></g>
      <path d="M1174 302Q1181 294 1190 302L1183 318Q1175 321 1169 314Z" fill="url(#gold)" stroke="#71451f" stroke-width="1.2"/><path d="M1174 318L1165 356L1156 371L1158 350L1169 314Z" fill="url(#gold)" stroke="#71451f" stroke-width="1.2"/><path d="M1156 371L1165 356" stroke="#061827" stroke-width="2.2"/><path d="M1169 313Q1178 320 1184 318" fill="none" stroke="#fff0bd" stroke-width="1.3"/>
    </g>
  </g>
  <rect x="1" y="1" width="1398" height="498" rx="19" fill="none" stroke="#2d6580" stroke-opacity=".33" stroke-width="2"/>
</svg>
