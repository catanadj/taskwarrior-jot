      <path d="M-30 331C178 344 287 414 498 401C690 389 807 315 1018 323C1173 329 1269 374 1432 372" stroke="#5ea6c2" stroke-width="2.5" opacity=".55"/>
      <path d="M-25 445C143 376 283 377 470 421C657 465 816 492 1004 466C1188 440 1278 389 1430 397" stroke="#2d789a" stroke-width="2.3" opacity=".55"/>
      <path d="M792 274C900 254 987 259 1089 285C1193 312 1289 310 1420 271" stroke="#7ab8ca" stroke-width="1.2" opacity=".17"/>
    </g>
    <g id="titleBlock">
