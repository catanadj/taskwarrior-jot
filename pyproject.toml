[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jot-taskwarrior"
dynamic = ["version"]
description = "Note-first companion for Taskwarrior and Taskwarrior-Nautical"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
  { name = "pooK" }
]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.50.1", "rich>=13.3.3"]
test = ["textual>=0.50.1", "rich>=13.3.3"]
dev = ["textual>=0.50.1", "rich>=13.3.3", "mypy>=1.11", "build>=1.2"]

[project.scripts]
jot = "jot_tui.launcher:main"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["jot_core*", "jot_tui*"]

[tool.setuptools.package-data]
jot_core = ["data/config-jot.toml", "data/templates/*.md", "data/hooks/*.py"]

[tool.setuptools.dynamic]
version = {attr = "jot_core.__version__"}

[tool.mypy]
python_version = "3.11"
files = [
  "jot_tui/app.py",
  "jot_tui/command_browser.py",
  "jot_tui/controllers",
  "jot_tui/modals",
  "jot_tui/panes",
  "jot_tui/rendering.py",
  "jot_tui/state.py",
  "jot_tui/palette.py",
]
follow_imports = "skip"
allow_untyped_defs = true
allow_untyped_globals = true
allow_untyped_decorators = true
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
