[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jot-taskwarrior"
dynamic = ["version"]
description = "Note-first companion for Taskwarrior and Taskwarrior-Nautical"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "pooK" }
]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.47"]
test = ["textual>=0.47"]

[project.scripts]
jot = "jot_core.cli:main"

[tool.setuptools]
packages = ["jot_core", "jot_tui"]

[tool.setuptools.dynamic]
version = {attr = "jot_core.__version__"}
