[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jot-taskwarrior"
dynamic = ["version"]
description = "Note-first companion for Taskwarrior and Taskwarrior-Nautical"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "pooK" }
]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.47"]
test = ["textual>=0.47"]
dev = ["textual>=0.47", "mypy>=1.11", "build>=1.2"]

[project.scripts]
jot = "jot_core.cli:main"

[tool.setuptools]
packages = ["jot_core", "jot_tui"]

[tool.setuptools.package-data]
jot_core = ["data/config-jot.toml", "data/templates/*.md", "data/hooks/*.py"]

[tool.setuptools.dynamic]
version = {attr = "jot_core.__version__"}

[tool.mypy]
python_version = "3.11"
files = [
  "jot_core/models.py",
  "jot_core/taskwarrior.py",
  "jot_core/editor.py",
  "jot_core/command_prefix.py",
  "jot_core/command_help.py",
  "jot_tui/palette.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
